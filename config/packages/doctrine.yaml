doctrine:
    dbal:
        # Multi-tenancy, see docs/architecture/tenancy.md. Both connections read DATABASE_URL, whose
        # database is app_main. The tenant connection is the default one, because everything the
        # application stores belongs to one customer: App\Core\Tenancy\TenantConnection
        # rewrites the database name to app_<tenant> and refuses to connect before a tenant is selected.
        default_connection: tenant
        connections:
            tenant:
                url: '%env(resolve:DATABASE_URL)%'
                wrapper_class: App\Core\Tenancy\TenantConnection
                profiling_collect_backtrace: '%kernel.debug%'
            # app_main: the tenant registry (later also the users), shared by all customers.
            main:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'
    orm:
        default_entity_manager: tenant
        entity_managers:
            tenant:
                connection: tenant
                validate_xml_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                mappings:
                    Plan:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Plan/Entity'
                        prefix: 'App\Plan\Entity'
                        alias: Plan
                    Project:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Project/Entity'
                        prefix: 'App\Project\Entity'
                        alias: Project
            main:
                connection: main
                validate_xml_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                mappings:
                    Tenancy:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Core/Tenancy/Entity'
                        prefix: 'App\Core\Tenancy\Entity'
                        alias: Tenancy

when@test:
    doctrine:
        dbal:
            connections:
                # app_main_test. The tenant databases get their suffix from the parameter
                # app.tenant_database_suffix (config/services.yaml).
                # "TEST_TOKEN" is typically set by ParaTest
                main:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            entity_managers:
                tenant:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool
                main:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
