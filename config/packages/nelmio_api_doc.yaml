# The REST API the editor talks to, documented from the code: the models in
# src/Application/Model and the #[OA\…] attributes on the controllers. The document is served
# in dev and test only (config/routes/nelmio_api_doc.yaml); the editor's TypeScript types are
# generated from it.
nelmio_api_doc:
    documentation:
        info:
            title: 'WebCAD API'
            version: ''
        # Order and one sentence per group in the UI. A tag a controller names that is missing
        # here still works; it is appended, undescribed, at the end.
        tags:
            - name: 'Plan'
              description: 'The drawing of a plan, loaded by the editor as one document.'
    media_types:
        - json
    areas:
        default:
            # Only routes whose controller carries #[Areas(['default'])] are documented. The path
            # is checked first, so a new endpoint outside these prefixes is missing from the docs.
            with_attribute: true
            path_patterns:
                - '^/api/'
    html_config:
        stoplight_config:
            basePath: '_doc'

# Generating the document takes a moment; in prod it is fixed for the life of a release.
when@prod:
    nelmio_api_doc:
        cache:
            pool: cache.app
