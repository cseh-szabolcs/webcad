security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        user_provider:
            id: App\Security\UserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # The API shares the login of "main" (context), but a guest gets a 401 instead of a redirect
        # to the login form, and the API URL is not remembered as the page to return to after login.
        api:
            pattern: ^/api/
            context: main
            lazy: true
            provider: user_provider
            entry_point: App\Security\ApiEntryPoint
            custom_authenticator:
                - App\Security\Authenticator\TokenAuthenticator
            remember_me: &remember_me
                secret: '%kernel.secret%'
                lifetime: '%app.remember_me_lifetime%'
                path: /
                always_remember_me: true
                signature_properties: [ 'authSignature' ]

        main:
            context: main
            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall
            # https://symfony.com/doc/current/security/impersonating_user.html

            lazy: true
            provider: user_provider
            entry_point: App\Security\Authenticator\UserAuthenticator
            custom_authenticator:
                - App\Security\Authenticator\UserAuthenticator
                - App\Security\Authenticator\TokenAuthenticator

            # Invalidates the session, so the tenant stored there is gone, and deletes the tenant
            # cookie (App\Core\Tenancy\TenantStorage::COOKIE)
            logout:
                path: user_auth_logout
                target: app_index
                delete_cookies:
                    tenant: ~

            remember_me: *remember_me

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: "^/admin", roles: ROLE_ADMIN }
        - { path: "^/api/*", roles: ROLE_USER }
        - { path: "^/([a-z]{2})/(app|fixtures|plan|project)(?:/(.*))?$", roles: ROLE_USER }

    role_hierarchy:
        ROLE_AUTH: []
        ROLE_USER: [ROLE_AUTH]
        ROLE_TENANT: [ROLE_USER]
        ROLE_ADMIN: [ROLE_TENANT]
        ROLE_ROOT: [ROLE_ADMIN]

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
